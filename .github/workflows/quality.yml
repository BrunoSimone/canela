name: Calidad de Canela
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: canela_ci
          POSTGRES_DB: canela_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SITE_MAINTENANCE_MODE: '1'
      CHECKOUT_MODE: disabled
      COMMERCE_PRODUCTION_APPROVED: '0'
      NEXT_PUBLIC_SITE_URL: https://www.canela-store.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:canela_ci@localhost:5432/canela_ci
      - run: pnpm build
